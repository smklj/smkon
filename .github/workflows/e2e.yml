name: E2E Browser Tests

on:
  pull_request:
    branches: [main, feature/smkon-production-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Um único run por vez: todos usam a mesma conta QA no staging.
  group: e2e-staging
  cancel-in-progress: false

jobs:
  browser:
    name: Playwright · Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PRs de forks não recebem secrets; não roda para eles.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CI: "true"
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Ref pública do Supabase de staging. A suíte aborta se o deployment não usar este projeto.
      E2E_SUPABASE_REF: xoyasrizivadxnpmzzno
    steps:
      - name: Check E2E configuration
        id: config
        run: |
          missing=""
          for name in E2E_BASE_URL E2E_EMAIL E2E_PASSWORD VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; echo "✗ $name ausente"; else echo "✓ $name configurado"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E não executado. Secrets ausentes:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Install pinned Playwright runner
        if: steps.config.outputs.ready == 'true'
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1

      - name: Install Chromium
        if: steps.config.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser tests against isolated staging
        if: steps.config.outputs.ready == 'true'
        run: npx playwright test

      - name: Upload screenshots and report
        if: ${{ always() && steps.config.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smkon-e2e-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
