name: CI

on:
  pull_request:
    branches: [main, fix/sprint-1-security-auth-foundation, 'feature/**']
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies (lockfile exato)
        run: npm ci
      - name: Dependency audit report (todas as dependências)
        run: npm audit --json > npm-audit.json || true; node -e 'const a=require("./npm-audit.json"); console.log("TOTAL", JSON.stringify(a.metadata?.vulnerabilities ?? {}))'
      - name: Dependency audit gate (dependências de produção, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  database:
    name: Database migrations and SQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Migrations + SQL tests (banco descartável, shim do Supabase)
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/test-db.sh shim
