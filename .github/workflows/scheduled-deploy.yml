name: Scheduled Vercel Deploy

on:
  schedule:
    # 02:48 UTC = 23:48 BRT (1ª vaga liberada na Vercel)
    - cron: '48 2 * * *'
    # 04:35 UTC = 01:35 BRT (lote de 20 vagas liberadas na Vercel)
    - cron: '35 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-deploy:
    name: Trigger Vercel Production Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger Vercel Deploy via commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(release): trigger production deploy on Vercel"
          git push origin main
